<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta id="theme_color" name="theme-color" content="#0d1a22" />
    <meta
      name="description"
      content="Oxidefall is a deterministic, modern falling-block puzzle game built in Rust and WebAssembly."
    />
    <title>Oxidefall</title>

    <script>
      (() => {
        const preferenceKey = "oxidefall.theme.v1";
        const systemQuery = window.matchMedia("(prefers-color-scheme: dark)");

        function readPreference() {
          try {
            const stored = window.localStorage.getItem(preferenceKey);
            return stored === "light" || stored === "dark" ? stored : "system";
          } catch {
            return "system";
          }
        }

        function applyTheme() {
          const preference = readPreference();
          const resolved =
            preference === "system"
              ? systemQuery.matches
                ? "dark"
                : "light"
              : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document
            .getElementById("theme_color")
            ?.setAttribute("content", resolved === "dark" ? "#0d1a22" : "#f1efe8");
        }

        applyTheme();
        if (systemQuery.addEventListener) {
          systemQuery.addEventListener("change", applyTheme);
        } else {
          systemQuery.addListener(applyTheme);
        }
      })();
    </script>

    <base data-trunk-public-url />
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-mutable-globals --enable-nontrapping-float-to-int --enable-bulk-memory --enable-sign-ext --enable-bulk-memory-opt"
    />
    <link data-trunk rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link data-trunk rel="copy-dir" href="assets/audio" />
    <script data-trunk src="assets/audio.js"></script>

    <style>
      :root {
        color-scheme: dark;
        --background: #0d1a22;
        --background-grid: rgba(116, 140, 151, 0.07);
        --text: #e8eef0;
        --muted: #9aaeb7;
        --accent: #e8a23a;
        --accent-bright: #f3bb5d;
        --accent-glow: rgba(232, 162, 58, 0.2);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        background: var(--background);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background: #f1efe8;
        --background-grid: rgba(73, 89, 96, 0.07);
        --text: #172a33;
        --muted: #526972;
        --accent: #b9680f;
        --accent-bright: #cd7f1d;
        --accent-glow: rgba(185, 104, 15, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app_shell {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      #app_shell {
        position: fixed;
        inset: 0;
        height: 100dvh;
      }

      body {
        background:
          linear-gradient(var(--background-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--background-grid) 1px, transparent 1px),
          var(--background);
        background-size: 32px 32px;
      }

      #oxidefall_canvas {
        position: absolute;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        display: block;
        width: calc(
          100% - env(safe-area-inset-left, 0) - env(safe-area-inset-right, 0)
        );
        height: calc(
          100% - env(safe-area-inset-top, 0) - env(safe-area-inset-bottom, 0)
        );
        border: 0;
        outline: 0;
        touch-action: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
      }

      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 22px;
        color: var(--text);
        text-align: center;
        letter-spacing: 0.12em;
        padding:
          calc(24px + env(safe-area-inset-top, 0))
          calc(24px + env(safe-area-inset-right, 0))
          calc(24px + env(safe-area-inset-bottom, 0))
          calc(24px + env(safe-area-inset-left, 0));
      }

      #loading h1 {
        display: flex;
        justify-content: center;
        margin: 0;
      }

      .loader_wordmark {
        display: block;
        width: min(68vw, 273px);
        height: auto;
        color: var(--text);
        filter: drop-shadow(0 0 18px var(--accent-glow));
      }

      #loading p {
        max-width: 32rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.6;
      }

      .loader_mark {
        display: grid;
        grid-template-columns: repeat(3, 14px);
        grid-template-rows: repeat(4, 14px);
        justify-content: center;
        gap: 2px;
        filter: drop-shadow(0 0 16px var(--accent-glow));
      }

      .loader_mark span {
        border: 1px solid var(--accent-bright);
        background: var(--accent);
        animation: pulse 1.4s ease-in-out infinite alternate;
      }

      .loader_mark span:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
      }

      .loader_mark span:nth-child(2) {
        grid-column: 2;
        grid-row: 1;
        animation-delay: 100ms;
      }

      .loader_mark span:nth-child(3) {
        grid-column: 3;
        grid-row: 1;
        animation-delay: 200ms;
      }

      .loader_mark span:nth-child(4) {
        grid-column: 1;
        grid-row: 2;
        animation-delay: 300ms;
      }

      .loader_mark span:nth-child(5) {
        grid-column: 3;
        grid-row: 2;
        animation-delay: 400ms;
      }

      .loader_mark span:nth-child(6) {
        grid-column: 1;
        grid-row: 3;
        animation-delay: 500ms;
      }

      .loader_mark span:nth-child(7) {
        grid-column: 3;
        grid-row: 3;
        animation-delay: 600ms;
      }

      .loader_mark span:nth-child(8) {
        grid-column: 1;
        grid-row: 4;
        animation-delay: 700ms;
      }

      .loader_mark span:nth-child(9) {
        grid-column: 2;
        grid-row: 4;
        animation-delay: 800ms;
      }

      .loader_mark span:nth-child(10) {
        grid-column: 3;
        grid-row: 4;
        animation-delay: 900ms;
      }

      .sr_only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes pulse {
        from {
          opacity: 0.45;
        }

        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader_mark span {
          animation: none;
        }
      }
    </style>
  </head>
