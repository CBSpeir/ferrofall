[package]
name = "ferrofall"
version = "0.1.0"
edition = "2024"
description = "A deterministic falling-block puzzle game for web and desktop"
license = "MIT OR Apache-2.0"
publish = false

[features]
qa-screenshot = ["eframe/__screenshot", "eframe/glow"]

[dependencies]
rand = "0.10.2"
rand_chacha = "0.10.0"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "web_screen_reader",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
log = "0.4.33"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Storage",
    "Window",
] }

[profile.release]
lto = "thin"
opt-level = 2
strip = true

[profile.dev.package."*"]
opt-level = 2
