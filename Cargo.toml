[package]
name = "oxidefall"
version = "0.1.0"
edition = "2024"
description = "A deterministic falling-block puzzle game for web and desktop"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["crates/oxidefall-core"]
exclude = ["tools/music_encoder"]
resolver = "3"

[features]
audio-lab = []
qa-screenshot = ["eframe/__screenshot"]

[dependencies]
getrandom = "0.4.3"
oxidefall-core = { path = "crates/oxidefall-core" }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "wayland",
    "wgpu",
    "x11",
] }
kira = { version = "0.12.2", default-features = false, features = [
    "cpal",
    "ogg",
    "vorbis",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "web_screen_reader",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
log = "0.4.33"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Storage",
    "Window",
] }

[profile.release]
lto = "thin"
opt-level = 2
strip = true

[profile.web-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
